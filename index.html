<!DOCTYPE html>
<html>

<head>

    <title>Spam Email Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static',filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Spam Email Detection</h1>

<form action="/predict" method="POST">

<textarea
name="message"
placeholder="Type your message..."
required>{{ message if message else "" }}</textarea>

<button type="submit">
Predict
</button>

</form>

{% if prediction %}

<h2>{{ prediction }}</h2>

{% endif %}

</div>

</body>
</html>
