<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam Email Detection</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container{
            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);

            width: 400px;

            text-align: center;
        }

        textarea{
            width: 100%;
            height: 120px;

            padding: 10px;

            margin-top: 10px;

            border-radius: 5px;
        }

        button{
            margin-top: 15px;

            padding: 10px 20px;

            border: none;

            background-color: #007bff;

            color: white;

            border-radius: 5px;

            cursor: pointer;
        }

        button:hover{
            background-color: #0056b3;
        }

        h2{
            margin-top: 20px;
            color: green;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Spam Email Detection</h1>

        <form action="/predict" method="post">

            <textarea
                name="message"
                placeholder="Enter your message here..."
                required
            ></textarea>

            <br>

            <button type="submit">
                Predict
            </button>

        </form>

        {% if prediction %}

            <h2>
                Prediction: {{ prediction }}
            </h2>

        {% endif %}

    </div>

</body>
</html>
